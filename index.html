<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#08101e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CRM·PR">
<meta name="description" content="CRM Comercial PremiosRed — Pipeline de colaboradores">
<link rel="manifest" href="manifest.json">
<title>CRM · PremiosRed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#F5A623;--gold-l:#FFD166;--cyan:#38BDF8;--indigo:#6366F1;--purple:#818CF8;
  --success:#22C55E;--danger:#EF4444;--warn:#F59E0B;
  --bg:#08101e;--card:rgba(255,255,255,0.06);--card-h:rgba(255,255,255,0.10);
  --glass:rgba(8,16,30,0.85);--border:rgba(255,255,255,0.09);
  --bcyan:rgba(56,189,248,0.18);--bgold:rgba(245,166,35,0.20);
  --text:#F0F4FF;--muted:rgba(220,230,255,0.55);--dim:rgba(200,215,255,0.28);
  --r:16px;--rs:10px;--font:'Plus Jakarta Sans',Inter,sans-serif;
  --tr:0.25s cubic-bezier(0.4,0,0.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:var(--font);color:var(--text);-webkit-font-smoothing:antialiased}
body{background:radial-gradient(ellipse 110% 70% at 0% 0%,rgba(56,189,248,0.14) 0%,transparent 52%),radial-gradient(ellipse 90% 65% at 100% 0%,rgba(99,102,241,0.18) 0%,transparent 52%),radial-gradient(ellipse 90% 70% at 100% 100%,rgba(245,166,35,0.13) 0%,transparent 52%),linear-gradient(160deg,#08101e 0%,#0a1628 35%,#0e1535 65%,#080e1c 100%)}
#app{height:100vh;display:flex;flex-direction:column;overflow:hidden;position:relative}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transform:translateX(20px);transition:opacity var(--tr),transform var(--tr)}
.scr.act{opacity:1;pointer-events:all;transform:translateX(0)}
.scr.exit{opacity:0;transform:translateX(-20px)}
/* HEADER */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 12px;background:var(--glass);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-bottom:1px solid var(--bcyan);flex-shrink:0;z-index:10}
.hdr-logo{display:flex;align-items:center;gap:10px}
.hdr-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#FFB627,var(--gold),#FF6B00);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#000;box-shadow:0 0 20px rgba(245,166,35,0.4);flex-shrink:0}
.hdr-title{font-size:17px;font-weight:800;letter-spacing:-0.3px}
.hdr-title em{color:var(--gold);font-style:normal}
.hdr-sub{font-size:10px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;margin-top:1px}
/* NAV */
.nav{display:flex;background:var(--glass);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-top:1px solid var(--bcyan);flex-shrink:0;z-index:10;padding-bottom:env(safe-area-inset-bottom,0)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 10px;background:none;border:none;color:var(--muted);cursor:pointer;font-family:var(--font);font-size:10px;font-weight:600;letter-spacing:0.3px;transition:color var(--tr);position:relative}
.nav-btn.on{color:var(--cyan)}
.nav-btn .badge{position:absolute;top:6px;right:calc(50% - 16px);background:var(--danger);color:#fff;font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.nav-btn svg{width:22px;height:22px;stroke-width:2;stroke:currentColor;fill:none}
/* CONTENT */
.cnt{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.cnt::-webkit-scrollbar{width:4px}
.cnt::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
/* CARDS */
.card{background:var(--card);border:1px solid var(--bcyan);border-radius:var(--r);backdrop-filter:blur(16px);box-shadow:0 2px 12px rgba(0,0,0,0.25),inset 0 1px 0 rgba(255,255,255,0.05);transition:var(--tr);padding:16px}
.card:hover{background:var(--card-h);border-color:rgba(56,189,248,0.28)}
.card-sm{padding:12px}
/* BUTTONS */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border:none;border-radius:var(--r);font-family:var(--font);font-size:15px;font-weight:700;cursor:pointer;transition:var(--tr);width:100%;text-decoration:none}
.btn-gold{background:linear-gradient(135deg,#FFB627,var(--gold),#FF6B00);color:#0a0a0a;box-shadow:0 4px 24px rgba(245,166,35,0.40)}
.btn-gold:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-gold:active{transform:scale(0.97)}
.btn-ghost{background:var(--card);border:1px solid var(--border);color:var(--muted)}
.btn-ghost:hover{background:var(--card-h);color:var(--text)}
.btn-cyan{background:rgba(56,189,248,0.12);border:1px solid rgba(56,189,248,0.25);color:var(--cyan)}
.btn-danger{background:rgba(239,68,68,0.10);border:1px solid rgba(239,68,68,0.28);color:var(--danger)}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:var(--rs);width:auto}
.btn-xs{padding:5px 10px;font-size:11px;font-weight:700;border-radius:8px;width:auto}
/* FORMS */
.fgrp{margin-bottom:14px}
.flbl{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px;letter-spacing:0.8px;text-transform:uppercase}
.finp{width:100%;padding:13px 15px;background:rgba(8,16,30,0.65);border:1px solid var(--bcyan);border-radius:var(--rs);color:var(--text);font-family:var(--font);font-size:15px;outline:none;transition:var(--tr);-webkit-appearance:none;appearance:none}
.finp:focus{border-color:var(--cyan);background:rgba(56,189,248,0.05);box-shadow:0 0 0 3px rgba(56,189,248,0.12)}
.finp::placeholder{color:var(--dim)}
select.finp option{background:#0e1535;color:var(--text)}
textarea.finp{resize:vertical;min-height:80px;line-height:1.5}
/* STATUS */
.st{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:0.3px;white-space:nowrap}
.st-prospecto{background:rgba(129,140,248,0.15);color:var(--purple);border:1px solid rgba(129,140,248,0.28)}
.st-contactado{background:rgba(56,189,248,0.12);color:var(--cyan);border:1px solid rgba(56,189,248,0.25)}
.st-respondio{background:rgba(245,166,35,0.12);color:var(--gold);border:1px solid rgba(245,166,35,0.28)}
.st-negociando{background:rgba(99,102,241,0.14);color:var(--indigo);border:1px solid rgba(99,102,241,0.28)}
.st-firmado{background:rgba(34,197,94,0.12);color:var(--success);border:1px solid rgba(34,197,94,0.28)}
.st-descartado{background:rgba(239,68,68,0.10);color:var(--danger);border:1px solid rgba(239,68,68,0.25)}
/* INTERACTION TYPE */
.it{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:8px;font-size:11px;font-weight:600;background:var(--card);border:1px solid var(--border)}
/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity var(--tr)}
.modal-bg.show{opacity:1;pointer-events:all}
.modal{background:linear-gradient(160deg,#0e1a2e,#101830);border:1px solid var(--bcyan);border-radius:24px 24px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom,0) + 32px);width:100%;max-width:500px;max-height:92vh;overflow-y:auto;transform:translateY(48px);transition:transform var(--tr)}
.modal-bg.show .modal{transform:translateY(0)}
.modal-drag{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 18px}
/* TOAST */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(10px);background:rgba(15,25,45,0.97);border:1px solid var(--border);border-radius:12px;padding:10px 18px;font-size:13px;font-weight:600;backdrop-filter:blur(20px);box-shadow:0 4px 24px rgba(0,0,0,0.5);opacity:0;transition:all var(--tr);z-index:999;white-space:nowrap;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:rgba(34,197,94,0.4);color:var(--success)}
.toast.err{border-color:rgba(239,68,68,0.4);color:var(--danger)}
.toast.info{border-color:rgba(56,189,248,0.4);color:var(--cyan)}
/* FAB */
.fab{position:fixed;bottom:76px;right:18px;z-index:50;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#FFB627,var(--gold),#FF6B00);border:none;color:#000;font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 24px rgba(245,166,35,0.55),0 2px 8px rgba(0,0,0,0.4);transition:var(--tr)}
.fab:hover{transform:scale(1.10);box-shadow:0 6px 32px rgba(245,166,35,0.65)}
.fab:active{transform:scale(0.95)}
/* STATS */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat-card{background:var(--card);border:1px solid var(--bcyan);border-radius:var(--rs);padding:14px;text-align:center;transition:var(--tr)}
.stat-num{font-size:30px;font-weight:900;line-height:1}
.stat-lbl{font-size:10px;color:var(--muted);margin-top:4px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase}
/* PROGRESS BAR */
.prog-wrap{margin:4px 0 12px}
.prog-lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:5px}
.prog-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;transition:width 0.6s ease}
/* COMPANY ROW */
.co-row{background:var(--card);border:1px solid var(--bcyan);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:var(--tr);position:relative;overflow:hidden}
.co-row::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px}
.co-row.pr-alta::before{background:var(--danger)}
.co-row.pr-media::before{background:var(--warn)}
.co-row.pr-baja::before{background:var(--border)}
.co-row:hover{background:var(--card-h);border-color:rgba(56,189,248,0.28);transform:translateX(2px)}
.co-name{font-size:16px;font-weight:800;margin-bottom:5px}
.co-meta{font-size:12px;color:var(--muted)}
/* INTERACTION */
.int-row{padding:12px 0;border-bottom:1px solid var(--border)}
.int-row:last-child{border-bottom:none}
/* SEARCH */
.search-wrap{position:relative;margin-bottom:14px}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none;width:16px;height:16px}
.search-wrap .finp{padding-left:38px}
/* FILTER CHIPS */
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;background:var(--card);border:1px solid var(--border);color:var(--muted);cursor:pointer;white-space:nowrap;transition:var(--tr)}
.chip.on{background:rgba(56,189,248,0.14);border-color:rgba(56,189,248,0.35);color:var(--cyan)}
/* PIPELINE */
.pipe{display:flex;gap:10px;overflow-x:auto;padding-bottom:12px;-webkit-overflow-scrolling:touch}
.pipe::-webkit-scrollbar{height:4px}
.pipe::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.pipe-col{min-width:200px;max-width:200px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px}
.pipe-hdr{font-size:11px;font-weight:800;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.pipe-cnt{font-size:11px;background:rgba(255,255,255,0.08);padding:2px 8px;border-radius:8px;color:var(--muted)}
.pipe-card{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:var(--rs);padding:10px;margin-bottom:8px;cursor:pointer;transition:var(--tr)}
.pipe-card:hover{background:rgba(255,255,255,0.09);border-color:var(--bcyan)}
/* PENDIENTE */
.pend-row{background:rgba(239,68,68,0.06);border:1px solid rgba(239,68,68,0.20);border-radius:var(--rs);padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:var(--tr)}
.pend-row.today{background:rgba(245,166,35,0.08);border-color:rgba(245,166,35,0.28)}
.pend-row:hover{filter:brightness(1.1)}
/* UTILS */
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.flex1{flex:1}
.fw900{font-weight:900}.fw800{font-weight:800}.fw700{font-weight:700}.fw600{font-weight:600}
.f10{font-size:10px}.f11{font-size:11px}.f12{font-size:12px}.f13{font-size:13px}.f14{font-size:14px}.f15{font-size:15px}.f18{font-size:18px}.f22{font-size:22px}.f26{font-size:26px}
.clr-gold{color:var(--gold)}.clr-cyan{color:var(--cyan)}.clr-muted{color:var(--muted)}.clr-dim{color:var(--dim)}.clr-success{color:var(--success)}.clr-danger{color:var(--danger)}
.mb4{margin-bottom:4px}.mb6{margin-bottom:6px}.mb8{margin-bottom:8px}.mb10{margin-bottom:10px}.mb12{margin-bottom:12px}.mb14{margin-bottom:14px}.mb16{margin-bottom:16px}.mb20{margin-bottom:20px}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.tc{text-align:center}
.sep{height:1px;background:var(--border);margin:14px 0}
.safe{height:env(safe-area-inset-bottom,8px)}
.sec-title{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
/* TIMELINE DOT */
.tl{position:relative;padding-left:20px}
.tl::before{content:'';position:absolute;left:7px;top:16px;bottom:0;width:1px;background:var(--border)}
.tl-dot{position:absolute;left:0;top:4px;width:14px;height:14px;border-radius:50%;background:var(--card);border:2px solid var(--bcyan);display:flex;align-items:center;justify-content:center;font-size:8px}
/* EMPTY */
.empty{text-align:center;padding:40px 20px;color:var(--dim)}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty-msg{font-size:14px;line-height:1.6}
/* IMPORT */
#import-file{display:none}
/* RESP */
@media(min-width:600px){.cnt{max-width:580px;margin:0 auto}.modal{border-radius:20px;margin-bottom:40px}.modal-bg{align-items:center}.fab{right:calc(50% - 270px)}}
</style>
</head>
<body>
<div id="app">
<!-- SCREEN: DASHBOARD -->
<div class="scr act" id="s-dash">
  <div class="hdr">
    <div class="hdr-logo"><div class="hdr-icon">PR</div><div><div class="hdr-title">Premios<em>Red</em> CRM</div><div class="hdr-sub" id="dash-date"></div></div></div>
    <div class="row" style="gap:6px">
      <button class="btn btn-ghost btn-sm" onclick="exportCSV()" title="Exportar CSV">⬇ CSV</button>
    </div>
  </div>
  <div class="cnt">
    <div class="stats" id="dash-stats"></div>
    <div id="dash-pipeline-prog" class="mb16"></div>
    <div class="row mb10"><div class="sec-title flex1">⚡ Próximas acciones</div><span class="f11 clr-dim" id="pend-count"></span></div>
    <div id="dash-pendientes" class="mb16"></div>
    <div class="row mb10"><div class="sec-title flex1">🕐 Actividad reciente</div></div>
    <div id="dash-feed"></div>
    <div class="safe"></div>
  </div>
</div>
<!-- SCREEN: EMPRESAS -->
<div class="scr" id="s-co">
  <div class="hdr">
    <div class="hdr-logo"><div class="hdr-icon">PR</div><div><div class="hdr-title">Empresas</div><div class="hdr-sub" id="co-count">0 empresas</div></div></div>
    <div class="row" style="gap:6px">
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('import-file').click()" title="Importar CSV">⬆ CSV</button>
      <input type="file" id="import-file" accept=".csv" onchange="importCSV(this)">
    </div>
  </div>
  <div class="cnt">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="finp" type="search" placeholder="Buscar por nombre, contacto, ciudad..." oninput="renderCompanies(this.value)" id="co-search">
    </div>
    <div class="chips" id="filter-chips">
      <div class="chip on" onclick="setFilter('')" id="ch-all">Todos</div>
      <div class="chip" onclick="setFilter('prospecto')" id="ch-prospecto">🔵 Prospecto</div>
      <div class="chip" onclick="setFilter('contactado')" id="ch-contactado">📧 Contactado</div>
      <div class="chip" onclick="setFilter('respondio')" id="ch-respondio">💬 Respondió</div>
      <div class="chip" onclick="setFilter('negociando')" id="ch-negociando">🤝 Negociando</div>
      <div class="chip" onclick="setFilter('firmado')" id="ch-firmado">✅ Firmado</div>
      <div class="chip" onclick="setFilter('descartado')" id="ch-descartado">❌ Descartado</div>
    </div>
    <div id="co-list"></div>
    <div class="safe"></div>
  </div>
  <button class="fab" onclick="openAddCompany()">+</button>
</div>
<!-- SCREEN: PIPELINE -->
<div class="scr" id="s-pipe">
  <div class="hdr">
    <div class="hdr-logo"><div class="hdr-icon">PR</div><div><div class="hdr-title">Pipeline</div><div class="hdr-sub">Vista kanban</div></div></div>
  </div>
  <div class="cnt"><div class="pipe" id="pipe-board"></div><div class="safe"></div></div>
</div>
<!-- SCREEN: DETAIL -->
<div class="scr" id="s-detail">
  <div class="hdr">
    <div class="row" style="gap:8px">
      <button class="btn btn-ghost btn-sm" onclick="goBack()" style="width:auto;padding:8px 12px;flex-shrink:0">← Volver</button>
      <div style="min-width:0"><div class="hdr-title" id="det-name" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px">—</div></div>
    </div>
    <div class="row" style="gap:6px">
      <button class="btn btn-ghost btn-sm" onclick="openEditCompany()" title="Editar" style="width:auto">✏️</button>
      <button class="btn btn-cyan btn-sm" onclick="openAddInteraction()" style="width:auto">+ Log</button>
    </div>
  </div>
  <div class="cnt" id="det-body"></div>
</div>
<!-- BOTTOM NAV -->
<nav class="nav" id="bot-nav">
  <button class="nav-btn on" onclick="nav('dash')" id="nb-dash">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Inicio
  </button>
  <button class="nav-btn" onclick="nav('co')" id="nb-co">
    <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Empresas
  </button>
  <button class="nav-btn" onclick="nav('pipe')" id="nb-pipe">
    <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>Pipeline
  </button>
</nav>
<!-- MODAL: EMPRESA -->
<div class="modal-bg" id="m-co"><div class="modal">
  <div class="modal-drag"></div>
  <div class="f18 fw800 mb16" id="m-co-title">Nueva Empresa</div>
  <div class="fgrp"><label class="flbl">Empresa *</label><input class="finp" id="f-name" placeholder="Iberia, ALSA, NH Hotels..."></div>
  <div class="fgrp"><label class="flbl">Sector</label>
    <select class="finp" id="f-sector"><option value="aerolinea">✈️ Aerolínea</option><option value="autobus">🚌 Autobús</option><option value="tren">🚂 Tren</option><option value="crucero">🚢 Crucero</option><option value="hotel">🏨 Hotel / Resort</option><option value="bar">🍺 Bar / Restaurante</option><option value="retail">🏪 Retail / Tienda</option><option value="otro">🏢 Otro</option></select>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    <div class="fgrp"><label class="flbl">País</label><input class="finp" id="f-country" value="España"></div>
    <div class="fgrp"><label class="flbl">Ciudad</label><input class="finp" id="f-city" placeholder="Madrid"></div>
  </div>
  <div class="fgrp"><label class="flbl">Web</label><input class="finp" id="f-web" placeholder="www.empresa.com" type="url"></div>
  <div class="fgrp"><label class="flbl">Nombre contacto</label><input class="finp" id="f-cname" placeholder="María García"></div>
  <div class="fgrp"><label class="flbl">Email contacto</label><input class="finp" id="f-cemail" placeholder="maria@empresa.com" type="email"></div>
  <div class="fgrp"><label class="flbl">Teléfono</label><input class="finp" id="f-cphone" placeholder="+34 600 000 000" type="tel"></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    <div class="fgrp"><label class="flbl">Estado</label>
      <select class="finp" id="f-status"><option value="prospecto">🔵 Prospecto</option><option value="contactado">📧 Contactado</option><option value="respondio">💬 Respondió</option><option value="negociando">🤝 Negociando</option><option value="firmado">✅ Firmado</option><option value="descartado">❌ Descartado</option></select>
    </div>
    <div class="fgrp"><label class="flbl">Prioridad</label>
      <select class="finp" id="f-priority"><option value="alta">🔴 Alta</option><option value="media">🟡 Media</option><option value="baja">⚪ Baja</option></select>
    </div>
  </div>
  <div class="fgrp"><label class="flbl">Notas</label><textarea class="finp" id="f-notes" placeholder="Contexto, detalles clave, observaciones..."></textarea></div>
  <button class="btn btn-gold mb8" onclick="saveCompany()">💾 Guardar</button>
  <button class="btn btn-ghost" onclick="closeModal('m-co')">Cancelar</button>
</div></div>
<!-- MODAL: INTERACCIÓN -->
<div class="modal-bg" id="m-int"><div class="modal">
  <div class="modal-drag"></div>
  <div class="f18 fw800 mb4">Registrar interacción</div>
  <div class="f13 clr-muted mb16" id="int-co-name">—</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    <div class="fgrp"><label class="flbl">Tipo</label>
      <select class="finp" id="i-type" onchange="onTypeChange(this.value)"><option value="email">📧 Email</option><option value="llamada">📞 Llamada</option><option value="whatsapp">💬 WhatsApp</option><option value="reunion">🤝 Reunión</option><option value="nota">📝 Nota</option></select>
    </div>
    <div class="fgrp"><label class="flbl">Fecha y hora</label><input class="finp" id="i-date" type="datetime-local"></div>
  </div>
  <div class="fgrp"><label class="flbl">Asunto / Resumen *</label><input class="finp" id="i-subject" placeholder="Llamada inicial de presentación..."></div>
  <div class="fgrp"><label class="flbl">Detalle completo</label><textarea class="finp" id="i-content" placeholder="Qué se habló, quién participó, puntos clave..."></textarea></div>
  <div class="fgrp"><label class="flbl">Resultado / Conclusión</label><input class="finp" id="i-outcome" placeholder="Interesados, piden presupuesto..."></div>
  <div class="fgrp"><label class="flbl">Próxima acción</label><input class="finp" id="i-next" placeholder="Enviar propuesta el lunes..."></div>
  <div class="fgrp"><label class="flbl">Fecha próxima acción</label><input class="finp" id="i-next-date" type="date"></div>
  <div class="fgrp"><label class="flbl">Actualizar estado</label>
    <select class="finp" id="i-status"><option value="">Sin cambio</option><option value="contactado">→ Contactado</option><option value="respondio">→ Respondió</option><option value="negociando">→ Negociando</option><option value="firmado">→ Firmado ✅</option><option value="descartado">→ Descartado ❌</option></select>
  </div>
  <button class="btn btn-gold mb8" onclick="saveInteraction()">💾 Guardar interacción</button>
  <button class="btn btn-cyan mb8" id="btn-open-email" onclick="openEmailFromInt()" style="display:none">📧 Abrir plantilla email</button>
  <button class="btn btn-ghost" onclick="closeModal('m-int')">Cancelar</button>
</div></div>
<!-- MODAL: EMAIL -->
<div class="modal-bg" id="m-email"><div class="modal">
  <div class="modal-drag"></div>
  <div class="f18 fw800 mb4">📧 Plantillas de email</div>
  <div class="f13 clr-muted mb16">Para: <strong id="em-to"></strong></div>
  <div id="em-tpls"></div>
  <div class="sep"></div>
  <button class="btn btn-ghost" onclick="closeModal('m-email')">Cerrar</button>
</div></div>
<!-- MODAL: CONFIRM -->
<div class="modal-bg" id="m-confirm"><div class="modal">
  <div class="modal-drag"></div>
  <div class="f18 fw800 mb8" id="conf-title">¿Confirmar?</div>
  <div class="f14 clr-muted mb20" id="conf-msg"></div>
  <button class="btn btn-danger mb8" id="conf-ok">Confirmar</button>
  <button class="btn btn-ghost" onclick="closeModal('m-confirm')">Cancelar</button>
</div></div>
<div class="toast" id="toast"></div>
</div>
<script>
const LS_CO='pr2_co',LS_INT='pr2_int';
let companies=[],interactions=[],editId=null,curCoId=null,filterSt='',prevNav='dash';
function load(){try{companies=JSON.parse(localStorage.getItem(LS_CO)||'[]')}catch(e){companies=[]}try{interactions=JSON.parse(localStorage.getItem(LS_INT)||'[]')}catch(e){interactions=[]}}
function save(){localStorage.setItem(LS_CO,JSON.stringify(companies));localStorage.setItem(LS_INT,JSON.stringify(interactions))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
const SL={prospecto:'Prospecto',contactado:'Contactado',respondio:'Respondió',negociando:'Negociando',firmado:'Firmado',descartado:'Descartado'};
const SE={prospecto:'🔵',contactado:'📧',respondio:'💬',negociando:'🤝',firmado:'✅',descartado:'❌'};
const SEC={aerolinea:'✈️',autobus:'🚌',tren:'🚂',crucero:'🚢',hotel:'🏨',bar:'🍺',retail:'🏪',otro:'🏢'};
const IT={email:'📧',llamada:'📞',whatsapp:'💬',reunion:'🤝',nota:'📝'};
const PC={prospecto:'var(--purple)',contactado:'var(--cyan)',respondio:'var(--gold)',negociando:'var(--indigo)',firmado:'var(--success)',descartado:'var(--danger)'};
function stBadge(s){return`<span class="st st-${s}">${SE[s]||''} ${SL[s]||s}</span>`}
function fmtDT(ts){if(!ts)return'';const d=new Date(ts);return d.toLocaleDateString('es-ES',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
function fmtD(ts){if(!ts)return'';return new Date(ts).toLocaleDateString('es-ES',{day:'2-digit',month:'short'})}
function daysDiff(ts){return Math.round((ts-Date.now())/(1000*60*60*24))}

// NAV
let curNav='dash';
const SCRS={dash:'s-dash',co:'s-co',pipe:'s-pipe',detail:'s-detail'};
const NBs={dash:'nb-dash',co:'nb-co',pipe:'nb-pipe'};
function nav(id){
  const cur=document.getElementById(SCRS[curNav]);
  if(cur){cur.classList.remove('act');cur.classList.add('exit');setTimeout(()=>cur.classList.remove('exit'),300)}
  curNav=id;
  document.getElementById(SCRS[id]).classList.add('act');
  Object.keys(NBs).forEach(k=>document.getElementById(NBs[k])?.classList.toggle('on',k===id));
  document.getElementById('bot-nav').style.display=['dash','co','pipe'].includes(id)?'flex':'none';
  if(id==='dash')renderDash();else if(id==='co')renderCompanies();else if(id==='pipe')renderPipeline();
}
function goToDetail(id){prevNav=curNav;curCoId=id;const cur=document.getElementById(SCRS[curNav]);if(cur){cur.classList.remove('act');cur.classList.add('exit');setTimeout(()=>cur.classList.remove('exit'),300)}curNav='detail';document.getElementById('s-detail').classList.add('act');document.getElementById('bot-nav').style.display='none';renderDetail(id)}
function goBack(){document.getElementById('s-detail').classList.remove('act');nav(prevNav)}
function openModal(id){document.getElementById(id).classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
let toastT;
function toast(msg,type='ok'){const t=document.getElementById('toast');t.textContent=msg;t.className='toast '+type+' show';clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3000)}
function confirm2(title,msg,cb){document.getElementById('conf-title').textContent=title;document.getElementById('conf-msg').textContent=msg;document.getElementById('conf-ok').onclick=()=>{closeModal('m-confirm');cb()};openModal('m-confirm')}

// DASHBOARD
function renderDash(){
  const d=new Date();document.getElementById('dash-date').textContent=d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
  const tot=companies.length,firm=companies.filter(c=>c.status==='firmado').length,neg=companies.filter(c=>c.status==='negociando').length;
  const hoy=new Date();hoy.setHours(0,0,0,0);const intH=interactions.filter(i=>new Date(i.ts)>=hoy).length;
  document.getElementById('dash-stats').innerHTML=`
    <div class="stat-card"><div class="stat-num clr-cyan">${tot}</div><div class="stat-lbl">Empresas</div></div>
    <div class="stat-card"><div class="stat-num clr-gold">${neg}</div><div class="stat-lbl">Negociando</div></div>
    <div class="stat-card"><div class="stat-num clr-success">${firm}</div><div class="stat-lbl">Firmados</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--purple)">${intH}</div><div class="stat-lbl">Logs hoy</div></div>`;
  const STAGES=['prospecto','contactado','respondio','negociando','firmado'];
  document.getElementById('dash-pipeline-prog').innerHTML=tot?STAGES.map(s=>{const n=companies.filter(c=>c.status===s).length;const pct=tot?Math.round(n/tot*100):0;return`<div class="prog-wrap"><div class="prog-lbl"><span>${SE[s]} ${SL[s]}</span><span>${n}</span></div><div class="prog-bar"><div class="prog-fill" style="width:${pct}%;background:${PC[s]}"></div></div></div>`}).join(''):'';
  const pends=interactions.filter(i=>i.nextDate).map(i=>{const co=companies.find(c=>c.id===i.coId)||{name:'?'};const d=daysDiff(i.nextDate);return{...i,co,d}}).filter(i=>i.d<=7).sort((a,b)=>a.d-b.d);
  document.getElementById('pend-count').textContent=pends.length?`${pends.length} pendiente${pends.length>1?'s':''}`:''
  document.getElementById('dash-pendientes').innerHTML=pends.length?pends.map(p=>`<div class="pend-row ${p.d<=0?'today':''}" onclick="goToDetail('${p.co.id}')"><div class="row mb4"><span class="fw700 f13 flex1">${SEC[p.co.sector]||'🏢'} ${p.co.name}</span><span class="f11 ${p.d<=0?'clr-danger':'clr-gold'}">${p.d<=0?'HOY / VENCIDO':`en ${p.d}d`}</span></div><div class="f12 clr-muted">→ ${p.next}</div></div>`).join(''):`<div class="f12 clr-dim" style="padding:8px 0">Sin acciones pendientes esta semana 🎉</div>`;
  const recent=[...interactions].sort((a,b)=>b.ts-a.ts).slice(0,8);
  document.getElementById('dash-feed').innerHTML=recent.length?recent.map(i=>{const co=companies.find(c=>c.id===i.coId)||{name:'?'};return`<div class="int-row"><div class="row mb4"><span>${IT[i.type]||'📝'}</span><span class="fw700 f14 flex1">${co.name}</span><span class="clr-dim f11">${fmtDT(i.ts)}</span></div><div class="f13 clr-muted">${i.subject||''}</div>${i.next?`<div class="f11 clr-dim mt4">→ ${i.next}</div>`:''}</div>`}).join(''):`<div class="empty"><div class="empty-icon">📋</div><div class="empty-msg">Sin actividad aún.<br>Añade empresas y empieza a registrar.</div></div>`;
  updatePendBadge(pends.filter(p=>p.d<=0).length);
}
function updatePendBadge(n){const b=document.querySelector('#nb-dash .badge');if(n>0){if(!b){const bd=document.createElement('span');bd.className='badge';document.getElementById('nb-dash').appendChild(bd)}document.querySelector('#nb-dash .badge').textContent=n}else if(b)b.remove()}

// COMPANIES
function setFilter(v){filterSt=v;document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));document.getElementById('ch-'+(v||'all'))?.classList.add('on');renderCompanies()}
function renderCompanies(q){
  q=(q!==undefined?q:document.getElementById('co-search')?.value||'').toLowerCase();
  let list=companies.filter(c=>(!q||c.name.toLowerCase().includes(q)||c.contactName?.toLowerCase().includes(q)||c.city?.toLowerCase().includes(q))&&(!filterSt||c.status===filterSt));
  list.sort((a,b)=>({alta:0,media:1,baja:2}[a.priority]||1)-({alta:0,media:1,baja:2}[b.priority]||1)||a.name.localeCompare(b.name));
  document.getElementById('co-count').textContent=`${list.length} empresa${list.length!==1?'s':''}`;
  const el=document.getElementById('co-list');
  if(!list.length){el.innerHTML=`<div class="empty"><div class="empty-icon">🏢</div><div class="empty-msg">No hay empresas.<br>Pulsa <strong style="color:var(--gold)">+</strong> para añadir.</div></div>`;return}
  el.innerHTML=list.map(co=>{const n=interactions.filter(i=>i.coId===co.id).length;const last=interactions.filter(i=>i.coId===co.id).sort((a,b)=>b.ts-a.ts)[0];return`<div class="co-row pr-${co.priority}" onclick="goToDetail('${co.id}')"><div class="row mb6"><span class="co-name flex1">${SEC[co.sector]||'🏢'} ${co.name}</span>${stBadge(co.status)}</div><div class="row wrap" style="gap:6px"><span class="co-meta flex1">${co.contactName||'Sin contacto'} · ${co.city||co.country||''}</span><span class="co-meta">${n} log${n!==1?'s':''} ${last?'· '+fmtD(last.ts):''}</span></div></div>`}).join('');
}

// PIPELINE
function renderPipeline(){
  const cols=['prospecto','contactado','respondio','negociando','firmado','descartado'];
  document.getElementById('pipe-board').innerHTML=cols.map(s=>{const cos=companies.filter(c=>c.status===s);return`<div class="pipe-col"><div class="pipe-hdr" style="color:${PC[s]}">${SE[s]} ${SL[s]}<span class="pipe-cnt">${cos.length}</span></div>${cos.map(c=>`<div class="pipe-card" onclick="goToDetail('${c.id}')"><div class="fw700 f13 mb4">${SEC[c.sector]||'🏢'} ${c.name}</div><div class="f11 clr-muted">${c.contactName||''}</div></div>`).join('')||`<div class="f11 clr-dim tc" style="padding:12px">Vacío</div>`}</div>`}).join('');
}

// DETAIL
function renderDetail(id){
  const co=companies.find(c=>c.id===id);if(!co)return;
  document.getElementById('det-name').textContent=`${SEC[co.sector]||'🏢'} ${co.name}`;
  const ints=interactions.filter(i=>i.coId===id).sort((a,b)=>b.ts-a.ts);
  const prLbl={alta:'🔴 Alta',media:'🟡 Media',baja:'⚪ Baja'};
  document.getElementById('det-body').innerHTML=`
    <div class="card mb12">
      <div class="row wrap mb10" style="gap:8px">${stBadge(co.status)}<span class="f12 clr-muted">${prLbl[co.priority]||''} prioridad</span><span class="f11 clr-dim" style="margin-left:auto">Desde ${co.createdAt?fmtD(co.createdAt):'—'}</span></div>
      ${co.contactName?`<div class="fw700 f15 mb6">${co.contactName}</div>`:''}
      ${co.contactEmail?`<div class="mb6"><a href="mailto:${co.contactEmail}" style="color:var(--cyan);text-decoration:none;font-size:14px">📧 ${co.contactEmail}</a></div>`:''}
      ${co.contactPhone?`<div class="mb6"><a href="tel:${co.contactPhone}" style="color:var(--cyan);text-decoration:none;font-size:14px">📞 ${co.contactPhone}</a></div>`:''}
      ${co.website?`<div class="mb6"><a href="${co.website.startsWith('http')?co.website:'https://'+co.website}" target="_blank" rel="noopener" style="color:var(--cyan);text-decoration:none;font-size:14px">🌐 ${co.website}</a></div>`:''}
      ${co.city||co.country?`<div class="f12 clr-muted">📍 ${[co.city,co.country].filter(Boolean).join(', ')}</div>`:''}
    </div>
    ${co.notes?`<div class="card card-sm mb12"><div class="sec-title mb6">Notas</div><div class="f13" style="line-height:1.6">${co.notes.replace(/\n/g,'<br>')}</div></div>`:''}
    <div class="row mb12" style="gap:8px">
      <button class="btn btn-gold flex1" onclick="openEmailModal('${id}')">📧 Email</button>
      <button class="btn btn-danger flex1" onclick="confirm2('Eliminar empresa','Esta acción eliminará la empresa y todo su historial. No se puede deshacer.',()=>deleteCompany('${id}'))">🗑 Eliminar</button>
    </div>
    <div class="row mb10"><div class="sec-title flex1">Log de actividad</div><span class="f11 clr-dim">${ints.length} registro${ints.length!==1?'s':''}</span></div>
    ${ints.length?`<div class="tl">${ints.map((i,idx)=>`<div class="int-row" style="position:relative"><div class="tl-dot">${IT[i.type]||'📝'}</div><div class="row mb4" style="padding-left:4px"><span class="it">${IT[i.type]} ${i.type}</span><span class="f11 clr-dim" style="margin-left:auto">${fmtDT(i.ts)}</span></div>${i.subject?`<div class="fw700 f14 mb4" style="padding-left:4px">${i.subject}</div>`:''}${i.content?`<div class="f13 clr-muted mb4" style="padding-left:4px;line-height:1.5">${i.content.replace(/\n/g,'<br>')}</div>`:''}${i.outcome?`<div class="f12 mb4" style="padding-left:4px"><span class="clr-dim">Resultado: </span>${i.outcome}</div>`:''}${i.next?`<div class="f12 mb4" style="padding-left:4px"><span class="clr-gold">→ </span><strong>${i.next}</strong>${i.nextDate?` <span class="clr-dim">(${fmtD(i.nextDate)})</span>`:''}</div>`:''}${idx<ints.length-1?'<div style="height:12px"></div>':''}</div>`).join('')}</div>`:`<div class="empty"><div class="empty-icon">📝</div><div class="empty-msg">Sin interacciones.<br>Toca <strong style="color:var(--cyan)">+ Log</strong> para registrar.</div></div>`}
    <div class="safe"></div>`;
}

// CRUD COMPANY
function openAddCompany(){editId=null;document.getElementById('m-co-title').textContent='Nueva Empresa';['f-name','f-city','f-web','f-cname','f-cemail','f-cphone','f-notes'].forEach(id=>document.getElementById(id).value='');document.getElementById('f-sector').value='otro';document.getElementById('f-country').value='España';document.getElementById('f-status').value='prospecto';document.getElementById('f-priority').value='media';openModal('m-co')}
function openEditCompany(){const co=companies.find(c=>c.id===curCoId);if(!co)return;editId=co.id;document.getElementById('m-co-title').textContent='Editar empresa';document.getElementById('f-name').value=co.name||'';document.getElementById('f-sector').value=co.sector||'otro';document.getElementById('f-country').value=co.country||'España';document.getElementById('f-city').value=co.city||'';document.getElementById('f-web').value=co.website||'';document.getElementById('f-cname').value=co.contactName||'';document.getElementById('f-cemail').value=co.contactEmail||'';document.getElementById('f-cphone').value=co.contactPhone||'';document.getElementById('f-status').value=co.status||'prospecto';document.getElementById('f-priority').value=co.priority||'media';document.getElementById('f-notes').value=co.notes||'';openModal('m-co')}
function saveCompany(){const name=document.getElementById('f-name').value.trim();if(!name){toast('El nombre es obligatorio','err');return}const co={id:editId||uid(),name,sector:document.getElementById('f-sector').value,country:document.getElementById('f-country').value.trim(),city:document.getElementById('f-city').value.trim(),website:document.getElementById('f-web').value.trim(),contactName:document.getElementById('f-cname').value.trim(),contactEmail:document.getElementById('f-cemail').value.trim(),contactPhone:document.getElementById('f-cphone').value.trim(),status:document.getElementById('f-status').value,priority:document.getElementById('f-priority').value,notes:document.getElementById('f-notes').value.trim(),updatedAt:Date.now()};if(editId){const i=companies.findIndex(c=>c.id===editId);companies[i]={...companies[i],...co}}else{co.createdAt=Date.now();companies.push(co)}save();closeModal('m-co');if(editId&&curCoId===editId)renderDetail(editId);else renderCompanies();toast(editId?'Empresa actualizada ✓':'Empresa añadida ✓')}
function deleteCompany(id){companies=companies.filter(c=>c.id!==id);interactions=interactions.filter(i=>i.coId!==id);save();goBack();toast('Empresa eliminada')}

// CRUD INTERACTION
function openAddInteraction(){const co=companies.find(c=>c.id===curCoId);document.getElementById('int-co-name').textContent=co?`${SEC[co.sector]||'🏢'} ${co.name}`:'';const now=new Date(),loc=new Date(now-now.getTimezoneOffset()*60000).toISOString().slice(0,16);document.getElementById('i-date').value=loc;['i-subject','i-content','i-outcome','i-next'].forEach(id=>document.getElementById(id).value='');document.getElementById('i-next-date').value='';document.getElementById('i-type').value='email';document.getElementById('i-status').value='';document.getElementById('btn-open-email').style.display='block';openModal('m-int')}
function onTypeChange(v){document.getElementById('btn-open-email').style.display=v==='email'?'block':'none'}
function saveInteraction(){const subject=document.getElementById('i-subject').value.trim();if(!subject){toast('El asunto es obligatorio','err');return}const dv=document.getElementById('i-date').value,ndv=document.getElementById('i-next-date').value;const int={id:uid(),coId:curCoId,type:document.getElementById('i-type').value,ts:dv?new Date(dv).getTime():Date.now(),subject,content:document.getElementById('i-content').value.trim(),outcome:document.getElementById('i-outcome').value.trim(),next:document.getElementById('i-next').value.trim(),nextDate:ndv?new Date(ndv).getTime():null};interactions.push(int);const ns=document.getElementById('i-status').value;if(ns){const i=companies.findIndex(c=>c.id===curCoId);if(i>=0){companies[i].status=ns;companies[i].updatedAt=Date.now()}}save();closeModal('m-int');renderDetail(curCoId);toast('Interacción registrada ✓')}
function openEmailFromInt(){closeModal('m-int');openEmailModal(curCoId)}

// EMAIL TEMPLATES
function openEmailModal(id){curCoId=id;const co=companies.find(c=>c.id===id)||{};const to=co.contactEmail||'';const cn=co.contactName||'';const nm=co.name||'';document.getElementById('em-to').textContent=to||'(sin email)';
const from='info@premiosred.com';
const tpls=[
  {n:'📬 Presentación inicial',s:`PremiosRed — Propuesta de colaboración · ${nm}`,b:`Estimado/a ${cn},\n\nMe pongo en contacto con usted desde PremiosRed para presentarle una oportunidad de colaboración premium que podría ofrecer un valor diferencial a sus clientes.\n\nPremiosRed es un sistema de packs de premios desde 6€, válido en 17 países, con sorteos de hasta 20.000€. Distribuimos a través de canales de transporte, hostelería y retail.\n\nMe gustaría agendar una breve llamada para presentarle la propuesta en detalle. ¿Tendría disponibilidad esta semana?\n\nQuedo a su disposición.\n\nAtentamente,\nPremiosRed | ${from}`},
  {n:'📩 Seguimiento (follow-up)',s:`Seguimiento propuesta PremiosRed · ${nm}`,b:`Estimado/a ${cn},\n\nMe permito contactarle de nuevo en relación a la propuesta que le envié hace unos días sobre PremiosRed.\n\n¿Ha tenido oportunidad de revisarla? Quedo a su disposición para resolver cualquier duda o ampliar información.\n\nAtentamente,\nPremiosRed | ${from}`},

// EXPORT CSV
function exportCSV(){if(!companies.length){toast('No hay datos para exportar','err');return}const h=['ID','Empresa','Sector','País','Ciudad','Web','Contacto','Email','Tel','Estado','Prioridad','Notas','Creado','Actualizado','Nº Logs'];const rows=[h,...companies.map(c=>[c.id,c.name,c.sector,c.country,c.city,c.website,c.contactName,c.contactEmail,c.contactPhone,c.status,c.priority,(c.notes||'').replace(/\n/g,' '),c.createdAt?new Date(c.createdAt).toLocaleDateString('es-ES'):'',c.updatedAt?new Date(c.updatedAt).toLocaleDateString('es-ES'):'',interactions.filter(i=>i.coId===c.id).length])];const csv=rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);a.download=`PremiosRed_CRM_${new Date().toISOString().slice(0,10)}.csv`;a.click();toast('CSV exportado ✓')}

// IMPORT CSV
function importCSV(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{try{const lines=e.target.result.split('\n').filter(l=>l.trim());if(lines.length<2){toast('CSV vacío','err');return}let imported=0;lines.slice(1).forEach(line=>{const cols=line.match(/(".*?"|[^,]+)(?=,|$)/g)||[];const clean=cols.map(c=>c.replace(/^"|"$/g,'').replace(/""/g,'"'));if(!clean[1])return;const co={id:clean[0]&&!companies.find(c=>c.id===clean[0])?clean[0]:uid(),name:clean[1]||'',sector:clean[2]||'otro',country:clean[3]||'España',city:clean[4]||'',website:clean[5]||'',contactName:clean[6]||'',contactEmail:clean[7]||'',contactPhone:clean[8]||'',status:clean[9]||'prospecto',priority:clean[10]||'media',notes:clean[11]||'',createdAt:Date.now(),updatedAt:Date.now()};if(!companies.find(c=>c.id===co.id)){companies.push(co);imported++}});save();renderCompanies();toast(`${imported} empresas importadas ✓`)}catch(ex){toast('Error leyendo CSV','err')}};r.readAsText(f,'UTF-8');input.value=''}
